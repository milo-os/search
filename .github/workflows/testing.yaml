name: "Execute Golang Tests"
on:
  push:

jobs:
  execute-tests:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && vars.MILO_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install dependencies
        run: go mod download
      - name: Execute golang tests
        run: go test -timeout 5m ./...
