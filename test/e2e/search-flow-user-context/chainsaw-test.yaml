apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: search-flow-user-context
spec:
  description: |
    Checks that a ResourceSearchQuery made in a user's own Milo context
    (/apis/iam.miloapis.com/v1alpha1/users/<id>/control-plane) only finds that
    user's documents, plus platform-root documents of AllContexts indexes.

    In a user context Milo sets the user extras
    iam.miloapis.com/parent-type=User and iam.miloapis.com/parent-name=<id>.
    The queries here impersonate alice and bob with those extras directly
    against the search apiserver, so the test covers the query's tenant filter
    but not Milo itself: neither the DiscoveryContextPolicy that serves
    resourcesearchqueries in user contexts nor the ProtectedResource that lets
    a user create them there.

    Two policies over kinds nothing else indexes, so each index holds only the
    documents seeded here:
      - Note (e2e-user-ctx-tenant-policy): visibility left at the default, Tenant.
      - Announcement (e2e-user-ctx-allcontexts-policy): visibility AllContexts.

    Each index gets eight documents via NATS ReindexEvents, named
    uc-<note|announcement>-<suffix>:
      suffix           tenant    tenantType
      alice            alice     user
      alice-titlecase  alice     User          (how the audit indexer stores types)
      bob              bob       user
      org-acme         acme      organization
      project-p-one    p-one     project
      project-alice    alice     project       (same name, different tenant type)
      platform         platform  platform
      global           global    Global

    Every assertion compares the exact sorted set of result names, so a
    missing or leaked document fails the test:
      - T0: unscoped query (platform root) sees all 16 documents.
      - T1: alice, Note: alice and alice-titlecase only.
      - T2: alice, Announcement: alice, alice-titlecase, platform, global.
      - T3: bob, Note: bob only.
      - T4: bob, Announcement: bob, platform, global.
      - T5: alice, Note and Announcement in one query: the union of T1 and T2,
            so each index keeps its own filter in a federated search.

  namespace: default

  steps:
    # =========================================================================
    # Pre-cleanup: idempotent teardown of any leftover resources. Deleting a
    # policy runs its finalizer, which deletes the policy's index.
    # =========================================================================
    - name: pre-cleanup
      description: "Removes leftover resources to ensure idempotent test execution"
      try:
        - script:
            timeout: 90s
            content: |
              kubectl delete resourceindexpolicy e2e-user-ctx-tenant-policy e2e-user-ctx-allcontexts-policy --ignore-not-found=true --timeout=60s || true
              kubectl delete job e2e-uc-nats-publisher --ignore-not-found=true || true
              kubectl delete job -n search-system -l e2e.search.test/suite=user-context --ignore-not-found=true || true
              kubectl delete configmap e2e-uc-nats-events --ignore-not-found=true || true
              kubectl delete clusterrolebinding search-user-ctx-impersonator search-user-ctx-searcher --ignore-not-found=true || true
              kubectl delete clusterrole search-user-ctx-impersonator search-user-ctx-searcher --ignore-not-found=true || true
              kubectl delete serviceaccount search-user-ctx-tester -n search-system --ignore-not-found=true || true
              sleep 5
            check:
              ($error): ~

    # =========================================================================
    # Step 1: RBAC — impersonation of alice and bob with their user-context
    # extras, and create on ResourceSearchQuery for both
    # =========================================================================
    - name: setup-rbac
      description: "Creates the tester ServiceAccount, impersonation rights and the searcher role"
      try:
        - apply:
            file: rbac.yaml

    # =========================================================================
    # Step 2: The two policies, and wait for both to be Ready
    # =========================================================================
    - name: apply-seed-policies
      description: "Creates a Tenant-visibility policy (Note) and an AllContexts policy (Announcement)"
      try:
        - apply:
            file: seed.yaml
        - wait:
            apiVersion: search.miloapis.com/v1alpha1
            kind: ResourceIndexPolicy
            name: e2e-user-ctx-tenant-policy
            timeout: 60s
            for:
              condition:
                name: Ready
                value: "True"
        - wait:
            apiVersion: search.miloapis.com/v1alpha1
            kind: ResourceIndexPolicy
            name: e2e-user-ctx-allcontexts-policy
            timeout: 60s
            for:
              condition:
                name: Ready
                value: "True"
        # Visibility was left unset on the Note policy; it defaults to Tenant.
        - assert:
            resource:
              apiVersion: search.miloapis.com/v1alpha1
              kind: ResourceIndexPolicy
              metadata:
                name: e2e-user-ctx-tenant-policy
              spec:
                visibility: Tenant
        - assert:
            resource:
              apiVersion: search.miloapis.com/v1alpha1
              kind: ResourceIndexPolicy
              metadata:
                name: e2e-user-ctx-allcontexts-policy
              spec:
                visibility: AllContexts

    # =========================================================================
    # Step 3: Publish 16 ReindexEvents via NATS — eight tenants per index
    #
    # SpecHash is omitted so the consumer skips the hash check.
    # =========================================================================
    - name: publish-reindex-events
      description: "Publishes eight tenant variants into each of the two indexes"
      try:
        - script:
            timeout: 120s
            content: |
              set -e
              NOTE_INDEX=$(kubectl get resourceindexpolicy e2e-user-ctx-tenant-policy -o jsonpath='{.status.indexName}')
              ANNOUNCEMENT_INDEX=$(kubectl get resourceindexpolicy e2e-user-ctx-allcontexts-policy -o jsonpath='{.status.indexName}')
              if [ -z "$NOTE_INDEX" ] || [ -z "$ANNOUNCEMENT_INDEX" ]; then
                echo "ERROR: indexName is empty on a policy status"
                exit 1
              fi
              echo "Using indexes: $NOTE_INDEX $ANNOUNCEMENT_INDEX"

              EVENTS_DIR=$(mktemp -d)
              # <kind> <index> <policy> <doc name> <tenant> <tenantType>
              event() {
                jq -nc --arg kind "$1" --arg index "$2" --arg policy "$3" \
                  --arg name "$4" --arg tenant "$5" --arg tenantType "$6" '{
                  id: ("e2e-" + $name),
                  policyName: $policy,
                  indexName: $index,
                  tenant: $tenant,
                  tenantType: $tenantType,
                  resource: {
                    apiVersion: "e2e-user-ctx.miloapis.com/v1alpha1",
                    kind: $kind,
                    metadata: {
                      name: $name,
                      uid: ("e2e-" + $name + "-uid"),
                      annotations: {"e2e.search.test/marker": "usercontexte2ern1"}
                    }
                  }
                }' > "$EVENTS_DIR/$4.json"
              }
              for spec in \
                "Note $NOTE_INDEX e2e-user-ctx-tenant-policy uc-note" \
                "Announcement $ANNOUNCEMENT_INDEX e2e-user-ctx-allcontexts-policy uc-announcement"; do
                set -- $spec
                event "$1" "$2" "$3" "$4-alice"           alice    user
                event "$1" "$2" "$3" "$4-alice-titlecase" alice    User
                event "$1" "$2" "$3" "$4-bob"             bob      user
                event "$1" "$2" "$3" "$4-org-acme"        acme     organization
                event "$1" "$2" "$3" "$4-project-p-one"   p-one    project
                event "$1" "$2" "$3" "$4-project-alice"   alice    project
                event "$1" "$2" "$3" "$4-platform"        platform platform
                event "$1" "$2" "$3" "$4-global"          global   Global
              done
              ls "$EVENTS_DIR"

              kubectl delete configmap e2e-uc-nats-events --ignore-not-found=true
              kubectl create configmap e2e-uc-nats-events --from-file="$EVENTS_DIR"
              rm -rf "$EVENTS_DIR"

              cat <<'JOBEOF' | kubectl apply -f -
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: e2e-uc-nats-publisher
                namespace: default
              spec:
                backoffLimit: 0
                ttlSecondsAfterFinished: 120
                template:
                  spec:
                    restartPolicy: Never
                    volumes:
                      - name: events
                        configMap:
                          name: e2e-uc-nats-events
                    containers:
                      - name: publisher
                        image: natsio/nats-box:latest
                        command:
                          - /bin/sh
                          - -c
                          - |
                            set -e
                            for f in /events/*.json; do
                              nats pub reindex.e2e.user-context "$(cat "$f")" --server nats://nats.nats-system.svc.cluster.local:4222
                            done
                        volumeMounts:
                          - name: events
                            mountPath: /events
              JOBEOF

              kubectl wait job/e2e-uc-nats-publisher --for=condition=complete --timeout=60s
            check:
              ($error): ~

    # =========================================================================
    # T0: Unscoped query at the platform root sees all 16 documents. Polls
    # until indexing catches up, so the exact-set checks below aren't racing
    # the indexer.
    # =========================================================================
    - name: T0-unscoped-query-sees-every-document
      description: "T0: Without user extras, all 16 seeded documents are returned"
      try:
        - script:
            timeout: 210s
            content: |
              WANT=$(jq -nc '[
                "alice", "alice-titlecase", "bob", "org-acme",
                "project-p-one", "project-alice", "platform", "global"
              ] | [("uc-note-", "uc-announcement-") as $p | .[] | $p + .] | sort')
              GOT=""
              for i in $(seq 1 20); do
                GOT=$(cat <<EOF | kubectl create --request-timeout=5s -f - -o json | jq -c '[.status.results[]?.resource.metadata.name] | sort'
              apiVersion: search.miloapis.com/v1alpha1
              kind: ResourceSearchQuery
              metadata:
                generateName: e2e-uc-unscoped-
              spec:
                targetResources:
                  - group: "e2e-user-ctx.miloapis.com"
                    version: v1alpha1
                    kind: Note
                  - group: "e2e-user-ctx.miloapis.com"
                    version: v1alpha1
                    kind: Announcement
                query: ""
                limit: 50
              EOF
              )
                if [ "$GOT" = "$WANT" ]; then
                  echo "OK: unscoped query got exactly $GOT"
                  exit 0
                fi
                echo "Waiting for indexing ($i): got $GOT"
                sleep 5
              done
              echo "FAIL: unscoped query"
              echo "  want: $WANT"
              echo "  got:  $GOT"
              exit 1
            check:
              ($error): ~

    # =========================================================================
    # T1: alice, Tenant index — only alice's own documents, in both casings of
    # the stored tenant type. Not bob, acme, p-one, the project named alice,
    # platform or Global.
    # Filter: (_tenant_type = "user" AND _tenant = "alice")
    # =========================================================================
    - name: T1-alice-tenant-index-returns-only-alice
      description: "T1: alice in her user context sees only her own Note documents"
      try:
        - script:
            timeout: 300s
            content: |
              sh ./query-as.sh e2e-uc-t1-alice-note alice Note \
                uc-note-alice uc-note-alice-titlecase
            check:
              ($error): ~

    # =========================================================================
    # T2: alice, AllContexts index — alice's documents plus the platform-root
    # ones. Not bob, acme, p-one or the project named alice.
    # Filter: (_tenant_type = "user" AND _tenant = "alice")
    #         OR _tenant_type IN ["platform", "Global"]
    # =========================================================================
    - name: T2-alice-allcontexts-index-adds-platform-root
      description: "T2: alice in her user context sees her own and platform-root Announcements"
      try:
        - script:
            timeout: 300s
            content: |
              sh ./query-as.sh e2e-uc-t2-alice-announcement alice Announcement \
                uc-announcement-alice uc-announcement-alice-titlecase \
                uc-announcement-platform uc-announcement-global
            check:
              ($error): ~

    # =========================================================================
    # T3: bob, Tenant index — only bob's document, never alice's.
    # =========================================================================
    - name: T3-bob-tenant-index-returns-only-bob
      description: "T3: bob in his user context sees only his own Note document"
      try:
        - script:
            timeout: 300s
            content: |
              sh ./query-as.sh e2e-uc-t3-bob-note bob Note \
                uc-note-bob
            check:
              ($error): ~

    # =========================================================================
    # T4: bob, AllContexts index — bob's document plus the platform-root ones,
    # never alice's.
    # =========================================================================
    - name: T4-bob-allcontexts-index-adds-platform-root
      description: "T4: bob in his user context sees his own and platform-root Announcements"
      try:
        - script:
            timeout: 300s
            content: |
              sh ./query-as.sh e2e-uc-t4-bob-announcement bob Announcement \
                uc-announcement-bob uc-announcement-platform uc-announcement-global
            check:
              ($error): ~

    # =========================================================================
    # T5: alice, both indexes in one federated query — each index keeps its
    # own filter: platform-root documents come back from Announcement only.
    # =========================================================================
    - name: T5-alice-both-indexes-keep-their-own-filters
      description: "T5: one query over both kinds returns the union of T1 and T2, nothing more"
      try:
        - script:
            timeout: 300s
            content: |
              sh ./query-as.sh e2e-uc-t5-alice-both alice Note,Announcement \
                uc-note-alice uc-note-alice-titlecase \
                uc-announcement-alice uc-announcement-alice-titlecase \
                uc-announcement-platform uc-announcement-global
            check:
              ($error): ~

    # =========================================================================
    # Cleanup
    # =========================================================================
    - name: cleanup
      description: "Removes all resources created by this test"
      try:
        - script:
            timeout: 90s
            content: |
              kubectl delete job e2e-uc-nats-publisher --ignore-not-found=true || true
              kubectl delete job -n search-system -l e2e.search.test/suite=user-context --ignore-not-found=true || true
              kubectl delete configmap e2e-uc-nats-events --ignore-not-found=true || true
              kubectl delete resourceindexpolicy e2e-user-ctx-tenant-policy e2e-user-ctx-allcontexts-policy --ignore-not-found=true --timeout=60s || true
              kubectl delete clusterrolebinding search-user-ctx-impersonator search-user-ctx-searcher --ignore-not-found=true || true
              kubectl delete clusterrole search-user-ctx-impersonator search-user-ctx-searcher --ignore-not-found=true || true
              kubectl delete serviceaccount search-user-ctx-tester -n search-system --ignore-not-found=true || true
            check:
              ($error): ~
