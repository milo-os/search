apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: search-indexer
  namespace: search-system
spec:
  streamName: AUDIT_EVENTS
  durableName: search-indexer
  deliverPolicy: all
  ackPolicy: explicit
  # The filter subject ensures we only get relevant events
  filterSubject: audit.>
  # The indexer's in-flight flush cap bounds how many flushes run concurrently
  # and, because the handler is sequential, how fast the indexer takes messages
  # off the consumer. It does not bound how many messages JetStream may leave
  # unacked: that is still MaxAckPending, kept at 1000000 deliberately so
  # replicas are never starved of work during a replay.
  maxAckPending: 1000000
  # ReplayPolicy indicates that the consumer will replay messages from the stream
  replayPolicy: instant
  # Must be at least 3x the indexer's --batch-ack-progress-interval (default
  # 60s) so a heartbeat always lands inside the window; the indexer checks that
  # against its compiled mirror of this value (cmd/search/indexer) at startup,
  # and against the live consumer once connected.
  ackWait: 300s
---
apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: search-reindexer
  namespace: search-system
spec:
  streamName: REINDEX_EVENTS
  durableName: search-reindexer
  deliverPolicy: all
  ackPolicy: explicit
  # The filter subject ensures we only get relevant events
  filterSubject: reindex.>
  maxAckPending: 1000000
  # ReplayPolicy indicates that the consumer will replay messages from the stream
  replayPolicy: instant
  # Same heartbeat invariant as search-indexer; see the note there.
  ackWait: 300s
